# The tutor's image, published for each version: pushing a tag v<VERSION>
# (e.g. v0.2.0, the same number as Tutor::VERSION in lib/tutor/version.rb)
# builds deploy/vps/Dockerfile for amd64 and pushes it to the GitHub
# Container Registry as ghcr.io/ruby-asterism/asterism-tutor:<version>
# (and :<major>.<minor>, :latest). A run by hand (workflow_dispatch) only
# builds, to check that it still does; it pushes nothing. Nothing runs on
# a branch's push.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The version in lib/tutor/version.rb
        run: |
          version="$(sed -n 's/^ *VERSION = "\(.*\)".*/\1/p' lib/tutor/version.rb)"
          if [ -z "${version}" ]; then
            echo "::error::no VERSION in lib/tutor/version.rb"
            exit 1
          fi
          echo "VERSION_RB=${version}" >> "$GITHUB_ENV"

      - name: The tag is that version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION_RB}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but lib/tutor/version.rb says ${VERSION_RB}"
            exit 1
          fi
          echo "TUTOR_VERSION=${VERSION_RB}" >> "$GITHUB_ENV"

      - name: The version of a run by hand
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "TUTOR_VERSION=${VERSION_RB}-dev" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ruby-asterism/asterism-tutor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=asterism-tutor

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          platforms: linux/amd64
          build-args: TUTOR_VERSION=${{ env.TUTOR_VERSION }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
